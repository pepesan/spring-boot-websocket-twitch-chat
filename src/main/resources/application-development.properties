spring.datasource.url=jdbc:sqlite:${APP_DATA_DIR:./.local/data}/oauth-credentials.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

# Supply these values from the ignored local .env file; no production settings are read.
twitch.clientId=${TWITCH_CLIENT_ID:}
twitch.clientSecret=${TWITCH_CLIENT_SECRET:}
twitch.redirect_uri=${TWITCH_REDIRECT_URI:http://localhost:8080/callback/twitch}
twitch.credentials.encryption-keyset=${TWITCH_TOKEN_ENCRYPTION_KEYSET:}
creator.accounts.public-url=http://localhost:8080
frontend.public-url=http://localhost:5173
chat.websocket.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
